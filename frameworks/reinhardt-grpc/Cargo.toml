[package]
name = "httparena-reinhardt-grpc"
version = "0.1.0"
edition = "2024"
default-run = "manage"

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[dependencies]
ctor = "0.6"
prost = "=0.14.4"
reinhardt = { version = "=0.3.3", package = "reinhardt-web", default-features = false, features = ["minimal", "conf", "commands", "db-postgres", "di", "grpc"] }
reinhardt-di = { version = "=0.3.3", default-features = false }
# Temporary workaround for reinhardt-web#5865: 0.3.3 does not re-export the
# DI handler macro. Remove this direct dependency after the facade fix ships.
reinhardt-grpc = { version = "=0.3.3", default-features = false, features = ["di"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "=0.14.6", features = ["transport", "tls-aws-lc"] }
tonic-prost = "=0.14.6"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "=0.14.6"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
