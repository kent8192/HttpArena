[package]
name = "httparena-reinhardt-websocket"
version = "0.1.0"
edition = "2024"
default-run = "manage"

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[dependencies]
ctor = "0.6"
reinhardt = { version = "=0.4.0-alpha.8", package = "reinhardt-web", default-features = false, features = ["minimal", "conf", "commands-server", "db-sqlite", "websockets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
