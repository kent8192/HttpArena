[package]
name = "httparena_reinhardt"
version = "0.1.0"
edition = "2024"
default-run = "manage"

[profile.dev]
codegen-units = 16
debug = 0

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
ctor = "0.6"
reinhardt = { version = "=0.4.0-alpha.8", package = "reinhardt-web", default-features = false, features = ["minimal", "conf", "commands-server", "db-postgres", "cache", "di"] }
reinhardt-db = { version = "=0.4.0-alpha.8", default-features = false, features = ["backends", "postgres"] }
reinhardt-middleware = { version = "=0.4.0-alpha.8", default-features = false, features = ["compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
