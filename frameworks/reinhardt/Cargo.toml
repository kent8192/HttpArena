[package]
name = "httparena_reinhardt"
version = "0.1.0"
edition = "2024"
default-run = "httparena_reinhardt"

[profile.dev]
codegen-units = 16
debug = 0

[[bin]]
name = "httparena_reinhardt"
path = "src/main.rs"

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
ctor = "0.6"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
num_cpus = "1"
reinhardt = { version = "=0.3.5", package = "reinhardt-web", default-features = false, features = ["minimal", "conf", "commands", "db-postgres", "cache", "di"] }
reinhardt-db = { version = "=0.3.5", default-features = false, features = ["backends", "postgres"] }
reinhardt-middleware = { version = "=0.3.5", default-features = false, features = ["compression"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
