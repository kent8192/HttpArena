services:
  proxy:
    build:
      context: ./proxy
    network_mode: host
    cpuset: "${GATEWAY_PROXY_CPUS:-0-19,64-83}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${GATEWAY_SERVER_CPUS:-20-31,84-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=${DATABASE_MAX_CONN:-256}
      - DATABASE_POOL_MAX_CONNECTIONS=${DATABASE_MAX_CONN:-256}
      - DATASET_PATH=/data/dataset.json
      - STATIC_DIR=/data/static
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
      - ${DATA_DIR}/static:/data/static:ro
